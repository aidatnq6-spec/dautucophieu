[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi==0.135.2", "pydantic==2.12.5", "pandas==2.3.3", "pyarrow==23.0.1", "uvicorn==0.42.0", "firebase-admin==7.7.0", "pypdf==5.1.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
investment_agent = ["repositories/migrations/*.sql", "ai/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
